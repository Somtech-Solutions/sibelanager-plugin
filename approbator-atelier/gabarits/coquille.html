/* =====================================================================
   SIB — Configuration de thème · tokens de marque
   Story A1 · T-20260730-0024 · EF-55 (identité visuelle) · EF-04 (WCAG 2.1 AA)
   Projet P-20260728-0002 · module Approbation des baux (Approbator)

   ---------------------------------------------------------------------
   ⛔ RÈGLE OPPOSABLE, INSCRITE ICI ET PAS SEULEMENT DANS LA DOCUMENTATION
   ---------------------------------------------------------------------
   Les deux GRIS DE LA MARQUE sont INTERDITS POUR DU TEXTE :

       --sib-gris-500     #878786   3,60:1 sur blanc  → ÉCHOUE AA (il faut 4,5:1)
       --sib-gris-ui-500  #8a8a8d   3,44:1 sur blanc  → ÉCHOUE AA

   Ils restent utilisables pour : BORDURES, ICÔNES DÉCORATIVES et FONDS.
   Pour du texte gris, utiliser --sib-gris-texte-700 (#57575a · 7,20:1 sur blanc,
   6,55:1 sur #f4f4f4), qui est le gris de marque assombri jusqu'à passer AA.

   Motif : sur un site vitrine, ces gris servent des libellés de 16 px et ça
   passe. Dans une file de tâches travaillée 7 j/7, en 13-14 px, avec des dates
   d'échéance et des scores de crédit à lire vite, ça ne passe pas.

   ---------------------------------------------------------------------
   PROVENANCE — palette RELEVÉE, jamais devinée
   ---------------------------------------------------------------------
   Source 1 : le bundle CSS du thème WordPress « beet » de sibelanger.com,
              servi sous /app/litespeed/css/<hash>.css. Les valeurs sont
              comptées et contextualisées par sélecteur, pas échantillonnées
              au hasard. ⚠ L'URL contient un hash de contenu : elle change au
              prochain déploiement du site. Re-résoudre le chemin
              /app/litespeed/css/ depuis la balise <link> de la page, jamais
              l'URL en dur.
   Source 2 : les pixels des trois logos officiels, échantillonnés exactement
              (sans quantification). Vérification refaite indépendamment le
              2026-07-30 : logo.jpg = #000000 36,3 % · #02305d 32,1 % ·
              #878786 31,6 %. Le #02305d du logo et le #03305d du CSS sont la
              même couleur à un point près (compression JPEG d'origine) —
              c'est la valeur CSS qui fait foi pour l'écran.

   La marque SIB est BICHROME : un bleu marine et un gris. Le nom du fichier
   « 2-colors-vertical-logo.png » le confirme.

   ---------------------------------------------------------------------
   ⛔ CE QUI N'EST PAS DE LA MARQUE ET NE DOIT JAMAIS ENTRER ICI
   ---------------------------------------------------------------------
   #c02b0a · #e20231 · #607382 · #2f4054 · toute la famille .gf_alert_*
   (#cbeca0, #faf2f5, #fffbcc, #d1e4f3) apparaissent dans le bundle mais
   viennent TOUTES du plugin Gravity Forms, jamais d'un sélecteur du thème
   « beet ». Les prendre pour la palette SIB, ce serait importer la charte
   d'un plugin WordPress dans une application métier.

   ---------------------------------------------------------------------
   ⚠️ DEUX ALERTES À PORTER AU CLIENT
   ---------------------------------------------------------------------
   1. Les deux gris de la marque échouent AA pour du texte (voir la règle
      ci-dessus). C'est une contrainte d'accessibilité, pas une préférence.
   2. AUCUN LOGO N'EST VECTORIEL. Le PNG de 502 px de large sera flou sur un
      écran haute densité à taille d'en-tête. DEMANDER LE SVG À SIB — deux
      minutes de demande qui évitent une dette permanente.

   ---------------------------------------------------------------------
   TYPOGRAPHIE — décision en attente de Maxime
   ---------------------------------------------------------------------
   Le thème public utilise Arial : police système par défaut, pas un choix de
   marque, et elle tient mal la densité d'un back-office. L'analyse recommande
   Inter (déjà chargée par le site public, neutre, excellente en petites
   tailles et en chiffres tabulaires — ce qui compte ici : scores, ratios,
   échéances). Décision VISIBLE PAR LE CLIENT, donc à trancher par Maxime.
   En attendant, la pile ci-dessous prend Inter si le poste l'a, et retombe
   proprement sinon — sans aucune dépendance réseau.
   ===================================================================== */

:root {
  /* ---- MARQUE — relevé ✅ (9 tokens) ------------------------------- */
  --sib-marine-700:     #03305d; /* CSS .button{background}, 106× · 13,25:1 /blanc → AAA   */
  --sib-gris-500:       #878786; /* logo, pixels exacts   ·  3,60:1 → BORDURES ET FONDS SEULEMENT */
  --sib-gris-ui-500:    #8a8a8d; /* CSS .link{color}, 33× ·  3,44:1 → BORDURES ET FONDS SEULEMENT */
  --sib-encre-900:      #1c1c1c; /* CSS body{color}       · 17,04:1 /blanc → AAA           */
  --sib-nuit-900:       #181d24; /* CSS .footer__top{background}                           */
  --sib-noir:           #000000; /* logo                                                   */
  --sib-surface-100:    #f4f4f4; /* CSS .filter{background}                                */
  --sib-bordure-300:    #b3b3b3; /* CSS var(--Border,#b3b3b3) — seul token nommé du thème  */
  --sib-blanc:          #ffffff; /* CSS body{background}                                   */

  /* ---- DÉRIVÉS — calculés, à faire valider 🧩 (4 tokens) ----------- */
  --sib-marine-900:     #00203d; /* marine assombri (survol)      · 16,48:1 /blanc → AAA   */
  --sib-marine-500:     #0a4a86; /* marine éclairci (liens, focus)·  8,99:1 /blanc → AAA   */
  --sib-marine-050:     #e6ecf3; /* teinte (ligne sélectionnée)   · marine dessus 11,14:1  */
  --sib-gris-texte-700: #57575a; /* gris de marque assombri JUSQU'À PASSER AA · 7,20:1     */

  /* ---- ÉTATS SÉMANTIQUES — inventés, AUCUNE SOURCE DANS LA MARQUE 🧩
     SIB n'a pas de couleur sémantique : pas de vert « conforme », pas de
     rouge « bloquant », pas de jaune « en attente ». Ceux-ci sont dérivés,
     désaturés pour cohabiter avec un marine dominant, et tous vérifiés AA
     au minimum. EF-55 exige qu'ils soient documentés avec leur ratio —
     d'où la page tokens.html, qui les CALCULE au lieu de les recopier.

     ⚠️ CONTRAINTE MÉTIER SUR LE JAUNE, à trancher avant le build : le mot
     « jaune » a un sens précis et durable chez SIB — c'est la réservation
     dans le Tableau des Locations, citée telle quelle dans 12 tâches de
     conformité du classeur MASTER (« Le logement est réservé en jaune »).
     Si l'ambre porte « échéance », il ne peut pas porter aussi
     « réservation ». Les maquettes utilisent l'ambre pour l'ÉCHÉANCE et
     rendent la réservation par un libellé explicite, jamais par la couleur.
  ------------------------------------------------------------------- */
  --sib-succes:         #0f6b3f;  --sib-succes-fond:   #e7f4ec; /* 5,81:1 → AA   */
  --sib-alerte:         #8a3b00;  --sib-alerte-fond:   #fdf2e3; /* 7,02:1 → AAA  */
  --sib-critique:       #b3261e;  --sib-critique-fond: #fdecea; /* 5,72:1 → AA   */
  --sib-info:           #03305d;  --sib-info-fond:     #e6ecf3; /* 11,14:1 → AAA */

  /* ---- TÉMOIN DE CONTRÔLE — volontairement dégradé -----------------
     Ce token N'EST PAS un token de la palette. Il est introduit exprès,
     déclaré « utilisable pour du texte » alors qu'il échoue le seuil de
     4,5:1, pour vérifier que le contrôle de contraste de tokens.html MORD
     réellement au lieu de recopier une table figée. S'il n'apparaît pas en
     rouge sur la page, c'est la page qui est cassée, pas le token.
     ⛔ Ne jamais l'utiliser dans une maquette ni dans le build.
  ------------------------------------------------------------------- */
  --sib-controle-degrade: #9aa7b4;

  /* ---- Typographie ------------------------------------------------- */
  --sib-police: "Inter", "Inter var", "Helvetica Neue", Arial, sans-serif;
  --sib-police-chiffres: "Inter", "SF Mono", "Menlo", Consolas, monospace;

  /* ---- Rythme ------------------------------------------------------ */
  --sib-r1: 4px;  --sib-r2: 8px;  --sib-r3: 12px;
  --sib-r4: 16px; --sib-r5: 24px; --sib-r6: 32px;
  --sib-arrondi: 6px;
  --sib-ombre: 0 1px 2px rgba(3, 48, 93, .08), 0 2px 8px rgba(3, 48, 93, .06);
}

/* =====================================================================
   LOGOS — intégrés en data: URI pour que les maquettes soient
   AUTOPORTANTES (aucune requête réseau, EF-54 / contrainte de l'epic).
   Les fichiers originaux sont versionnés à côté : logo-sib.png,
   logo-sib-blanc.png, logo-sib-vertical.png.
   ===================================================================== */
.sib-logo {
  display: block;
  width: 148px; height: 41px;
  background: var(--logo-sib-clair) no-repeat center / contain;
}
.sib-logo--blanc {
  width: 148px; height: 41px;
  background: var(--logo-sib-blanc) no-repeat center / contain;
}

/* =====================================================================
   SIB — socle commun des 5 maquettes d'exploration UX
   Epic E-20260730-0001 · Projet P-20260728-0002

   Ce fichier porte CE QUI DOIT ÊTRE IDENTIQUE d'une maquette à l'autre :
   l'en-tête SIB, le bandeau Loi 25, la signalétique des archétypes, celle
   du grain de tâche, celle de bloquant/délai, les boutons et le banc
   d'essai (largeur d'écran, niveaux de gris).

   Motif : on compare des COQUILLES, pas des styles. Si chaque maquette
   dessinait ses propres badges, la comparaison porterait sur le graphisme
   au lieu de porter sur la structure d'interaction — et l'exercice entier
   ne servirait à rien.

   Ce que chaque maquette ajoute par-dessus : SA MISE EN PAGE. Rien d'autre.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--sib-police);
  font-size: 14px;
  line-height: 1.45;
  color: var(--sib-encre-900);
  background: #dfe3e8;
  -webkit-font-smoothing: antialiased;
}

/* =====================================================================
   1 · BANC D'ESSAI — la barre noire du haut
   Elle N'EST PAS l'application. C'est l'instrument de mesure : il sert à
   noter les critères ⑥ (lisibilité en niveaux de gris) et ⑧ (tenue sur
   l'écran réel) de la grille gelée, sur un fait plutôt que sur une
   intuition. Elle disparaît en impression.
   ===================================================================== */
/* ⚠️ HAUTEUR ÉGALISÉE — correctif D3 de la revue indépendante.
   La première version laissait le banc passer à la ligne. Résultat mesuré à
   1366×768 : 92 px de banc sur #3 (deux boutons de mode en plus) contre
   51 px sur les autres, et 105 px d'instrument contre 72 — soit **74 px de
   handicap** sur la seule direction que l'instrument était censé mesurer
   équitablement. Un instrument non étalonné mesure fidèlement un monde qui
   n'existe pas : c'est exactement le défaut que ce chantier traque.

   Le banc et l'encart d'instrument sont donc désormais sur UNE SEULE LIGNE,
   à hauteur fixe et identique pour les cinq maquettes ; le débordement part
   en défilement horizontal plutôt qu'en hauteur volée à la coquille.
   Et le bouton « Masquer les instruments » retire les deux du flux, pour
   qu'on puisse mesurer la coquille SANS la règle qui la mesure. */
.banc {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: nowrap; align-items: center; gap: var(--sib-r4);
  padding: var(--sib-r2) var(--sib-r4);
  height: 51px; box-sizing: border-box;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;
  background: var(--sib-nuit-900);
  color: var(--sib-blanc);
  font-size: 12px;
  border-bottom: 3px solid var(--sib-marine-700);
}
.banc > * { flex: 0 0 auto; }

/* Retire banc et instrument DU FLUX — pas seulement de la vue. C'est ce qui
   permet de noter le critère ⑧ sur la coquille seule. */
body.sans-instruments .banc,
body.sans-instruments .instrument,
body.sans-instruments .pli { display: none; }
.banc a { color: var(--sib-blanc); }
.banc__titre { font-weight: 700; letter-spacing: .01em; }
.banc__titre small { display: block; font-weight: 400; opacity: .82; letter-spacing: 0; }
.banc__groupe { display: flex; align-items: center; gap: var(--sib-r1); }
.banc__etiquette { opacity: .82; margin-right: var(--sib-r1); }
.banc__spacer { flex: 1 1 auto; }

.banc button, .banc a.banc__lien {
  font: inherit; font-size: 12px;
  padding: 3px 9px;
  border: 1px solid rgba(255,255,255,.42);
  border-radius: var(--sib-arrondi);
  background: transparent; color: var(--sib-blanc);
  cursor: pointer; text-decoration: none;
}
.banc button:hover, .banc a.banc__lien:hover { background: rgba(255,255,255,.14); }
.banc button[aria-pressed="true"] {
  background: var(--sib-blanc); color: var(--sib-nuit-900);
  border-color: var(--sib-blanc); font-weight: 700;
}
.banc button:focus-visible, .banc a:focus-visible {
  outline: 3px solid #ffd479; outline-offset: 2px;
}

/* Le cadre qui simule la largeur d'écran (critère ⑧) ------------------ */
.cadre {
  position: relative;
  margin: 0 auto;
  background: var(--sib-blanc);
  min-height: calc(100vh - 46px);
  box-shadow: 0 0 0 1px rgba(3,48,93,.18);
  transition: max-width .18s ease;
  container-type: inline-size;
}

/* ---------------------------------------------------------------------
   LA LIGNE DE PLI — correctif D3.
   La revue a montré que le phénomène du critère ⑧ n'est PAS un seuil de
   largeur mais une conjonction LARGEUR × HAUTEUR : à 1366×1080 rien ne
   souffre, à 1920×768 rien ne souffre non plus, et c'est à 1366×768 que
   l'action passe sous le pli. Le commutateur de largeur seul ne pouvait
   pas le montrer — d'où cette règle, qui trace le bord bas d'un écran de
   la hauteur choisie. Ce qui tombe sous la ligne est hors de vue au
   chargement, sans défiler.
   ------------------------------------------------------------------- */
.pli {
  position: absolute; left: 0; right: 0; z-index: 40;
  border-top: 2px dashed var(--sib-critique);
  pointer-events: none;
  display: none;
}
.pli[data-actif="oui"] { display: block; }
.pli::after {
  content: attr(data-libelle);
  position: absolute; right: 8px; top: 2px;
  background: var(--sib-critique); color: var(--sib-blanc);
  font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 0 0 3px 3px;
}
.cadre[data-largeur="1920"] { max-width: 1920px; }
.cadre[data-largeur="1440"] { max-width: 1440px; }
.cadre[data-largeur="1366"] { max-width: 1366px; }
.cadre[data-largeur="1280"] { max-width: 1280px; }
/* 1072 px : seuil MESURÉ chez #3 — c'est là, et pas à 1380, que son volet
   de détail passe sous 700 px (correctif D1). */
.cadre[data-largeur="1072"] { max-width: 1072px; }

/* Rendu en niveaux de gris (critère ⑥) --------------------------------
   Si une information disparaît quand ce commutateur est actif, c'est
   qu'elle était portée par la couleur seule — ce qu'EF-04 interdit. */
body.gris .cadre { filter: grayscale(1); }
body.gris .banc__gris-actif { display: inline; }
.banc__gris-actif { display: none; color: #ffd479; font-weight: 700; }

/* =====================================================================
   2 · EN-TÊTE DE L'APPLICATION — identique aux 5 maquettes (EF-55)
   ===================================================================== */
.entete {
  display: flex; align-items: center; gap: var(--sib-r4);
  padding: var(--sib-r3) var(--sib-r5);
  background: var(--sib-blanc);
  border-bottom: 1px solid var(--sib-bordure-300);
}
.entete--sombre { background: var(--sib-nuit-900); color: var(--sib-blanc); }
.entete--sombre .entete__niveau { border-color: rgba(255,255,255,.5); color: var(--sib-blanc); }
.entete__spacer { flex: 1 1 auto; }
.entete__niveau {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--sib-marine-700);
  color: var(--sib-marine-700);
  font-size: 12px; font-weight: 700;
}
.entete__agent { font-size: 12px; color: var(--sib-gris-texte-700); }
.entete--sombre .entete__agent { color: #dfe3e8; }

/* Bandeau Loi 25 — présent sur TOUTE maquette, jamais masquable -------- */
.bandeau-factice {
  display: flex; align-items: center; gap: var(--sib-r2);
  padding: 6px var(--sib-r5);
  background: var(--sib-alerte-fond);
  color: var(--sib-alerte);
  border-bottom: 1px solid var(--sib-alerte);
  font-size: 12px; font-weight: 600;
}

/* =====================================================================
   3 · SIGNALÉTIQUE DES SIX ARCHÉTYPES (BRD §2.2 · critère ④)
   Chaque archétype porte UN GLYPHE et UN STYLE DE BORDURE distincts.
   Le glyphe et la bordure survivent aux niveaux de gris ; la couleur ne
   fait qu'accélérer la lecture. C'est l'application directe d'EF-04 :
   « aucune information n'est portée par la couleur seule ».
   ===================================================================== */
.arch {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px 1px 6px;
  border-radius: 3px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .02em; white-space: nowrap;
  background: var(--sib-blanc);
}
.arch__g { font-size: 13px; line-height: 1; }

/* confirmation pré-remplie — glyphe ✓, bordure pleine */
.arch--confirmation { border: 1px solid var(--sib-succes); color: var(--sib-succes); background: var(--sib-succes-fond); }
/* automatique — glyphe ⚙, chip plein (l'app a déjà agi, rien à faire) */
.arch--automatique  { border: 1px solid var(--sib-marine-700); background: var(--sib-marine-700); color: var(--sib-blanc); }
/* vérification externe — glyphe ⌕, bordure double */
.arch--verification { border: 3px double var(--sib-marine-700); color: var(--sib-marine-700); background: var(--sib-marine-050); }
/* décision — glyphe ⚖, bordure épaisse (le vrai jugement humain) */
.arch--decision     { border: 2px solid var(--sib-encre-900); color: var(--sib-encre-900); background: var(--sib-blanc); }
/* appel — glyphe ☎, bordure pointillée */
.arch--appel        { border: 2px dotted var(--sib-marine-700); color: var(--sib-marine-700); background: var(--sib-blanc); }
/* note — glyphe ✎, bordure tiretée légère */
.arch--note         { border: 1px dashed var(--sib-gris-texte-700); color: var(--sib-gris-texte-700); background: var(--sib-surface-100); }

/* =====================================================================
   4 · GRAIN DE LA TÂCHE (EF-02 · arbitrage du 2026-07-30)
   « La file ne doit JAMAIS confondre une carte de personne et une carte
   de dossier — et ça doit se voir sans ouvrir la carte. »

   Trois marqueurs redondants, exprès :
     a) le GLYPHE          ( ◉ personne  /  ▤ dossier )
     b) le LIBELLÉ         ( le nom de la personne / le n° de bail )
     c) le FILET DE GAUCHE ( plein pour personne, hachuré pour dossier )
   Redondance assumée : à trois marqueurs dont deux non colorés, la
   distinction survit aux niveaux de gris ET à la densité du cockpit.
   ===================================================================== */
.grain {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.grain--personne { background: var(--sib-marine-050); color: var(--sib-marine-900); border: 1px solid var(--sib-marine-500); }
.grain--dossier  { background: var(--sib-surface-100); color: var(--sib-encre-900); border: 1px dashed var(--sib-gris-texte-700); }
.grain__g { font-size: 12px; line-height: 1; }

/* Le filet de gauche, porté par la carte ou la ligne elle-même */
.f-personne { border-left: 5px solid var(--sib-marine-700); }
.f-dossier  {
  border-left: 5px solid transparent;
  border-image: repeating-linear-gradient(
    45deg, var(--sib-gris-texte-700) 0 3px, transparent 3px 6px) 5;
}

/* =====================================================================
   5 · BLOQUANT / NON BLOQUANT / DÉLAI (EF-47 · critère ⑥)
   Chaque état porte un GLYPHE et un MOT, jamais une couleur seule.
   ===================================================================== */
.etat {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.etat--bloquant     { background: var(--sib-critique-fond); color: var(--sib-critique); border: 2px solid var(--sib-critique); }
.etat--non-bloquant { background: var(--sib-blanc);         color: var(--sib-gris-texte-700); border: 1px solid var(--sib-bordure-300); }
.etat--delai        { background: var(--sib-alerte-fond);   color: var(--sib-alerte);   border: 1px solid var(--sib-alerte); }
.etat--fait         { background: var(--sib-succes-fond);   color: var(--sib-succes);   border: 1px solid var(--sib-succes); }

/* Urgence d'emménagement — le tri d'EF-03 rendu lisible sans clic ------ */
.urgence {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
  padding: 1px 7px; border-radius: 3px;
  border: 1px solid currentColor;
}
.urgence--imminente { color: var(--sib-critique); background: var(--sib-critique-fond); }
.urgence--proche    { color: var(--sib-alerte);   background: var(--sib-alerte-fond); }
.urgence--normale   { color: var(--sib-gris-texte-700); background: var(--sib-blanc); border-color: var(--sib-bordure-300); }

/* =====================================================================
   6 · BOUTONS ET CLAVIER (EF-04 — « en 1 clic » = UN SEUL GESTE, et le
   geste équivalent au clavier existe sur toute confirmation et décision)
   ===================================================================== */
.btn {
  font: inherit; font-weight: 700;
  display: inline-flex; align-items: center; gap: var(--sib-r2);
  padding: 8px 16px;
  border-radius: var(--sib-arrondi);
  border: 1px solid var(--sib-marine-700);
  background: var(--sib-blanc); color: var(--sib-marine-700);
  cursor: pointer;
}
.btn--primaire { background: var(--sib-marine-700); color: var(--sib-blanc); }
.btn--primaire:hover { background: var(--sib-marine-900); border-color: var(--sib-marine-900); }
.btn--fantome  { border-color: var(--sib-bordure-300); color: var(--sib-gris-texte-700); }
.btn--danger   { border-color: var(--sib-critique); color: var(--sib-critique); }
.btn--danger:hover { background: var(--sib-critique); color: var(--sib-blanc); }
.btn--grand    { padding: 14px 26px; font-size: 17px; }
.btn:hover     { background: var(--sib-marine-050); }
.btn--primaire:hover { background: var(--sib-marine-900); }

/* Anneau de focus visible partout — condition de « se parcourt sans souris » */
:where(a, button, [tabindex]):focus-visible,
.ligne:focus-visible, .carte:focus-visible {
  outline: 3px solid var(--sib-marine-500);
  outline-offset: 2px;
  border-radius: 3px;
}

kbd {
  font-family: var(--sib-police-chiffres); font-size: 11px; font-weight: 700;
  padding: 1px 6px; border-radius: 4px;
  border: 1px solid var(--sib-gris-texte-700);
  border-bottom-width: 2px;
  background: var(--sib-surface-100); color: var(--sib-encre-900);
}
.barre-clavier {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sib-r4);
  padding: 6px var(--sib-r5);
  background: var(--sib-surface-100);
  border-top: 1px solid var(--sib-bordure-300);
  font-size: 11px; color: var(--sib-gris-texte-700);
}

/* =====================================================================
   7 · DONNÉE QUI JUSTIFIE LA TÂCHE (EF-04 · critère ②)
   Le « bloc de justification » : la donnée que l'agent doit lire AVANT de
   confirmer. Il est identique d'une maquette à l'autre — ce qui change
   d'une coquille à l'autre, c'est OÙ il tient et COMMENT il se comprime.
   ===================================================================== */
.justif {
  background: var(--sib-surface-100);
  border: 1px solid var(--sib-bordure-300);
  border-radius: var(--sib-arrondi);
  padding: var(--sib-r3);
}
.justif__titre {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--sib-gris-texte-700);
  margin: 0 0 var(--sib-r2);
}
.champs { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--sib-r3); margin: 0; }
.champs dt { color: var(--sib-gris-texte-700); font-size: 12px; }
.champs dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.chiffre { font-family: var(--sib-police-chiffres); font-variant-numeric: tabular-nums; }
.muted   { color: var(--sib-gris-texte-700); }   /* JAMAIS --sib-gris-500 : il échoue AA */
.petit   { font-size: 12px; }
.tres-petit { font-size: 11px; }

/* Score de crédit — présenté avec sa bande, jamais la couleur seule ---- */
.score { display: flex; align-items: baseline; gap: var(--sib-r2); }
.score__val { font-family: var(--sib-police-chiffres); font-size: 26px; font-weight: 700; line-height: 1; }
.score__bande { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 3px; border: 1px solid currentColor; }
.score__bande--bon    { color: var(--sib-succes);   background: var(--sib-succes-fond); }
.score__bande--moyen  { color: var(--sib-alerte);   background: var(--sib-alerte-fond); }
.score__bande--faible { color: var(--sib-critique); background: var(--sib-critique-fond); }

/* Tableau judiciaire — le code couleur du rapport d'origine est conservé
   (EF-10), MAIS doublé d'un mot : rouge=coupable, jaune=en cours,
   gris=acquitté ne survivraient pas aux niveaux de gris tout seuls. */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--sib-bordure-300); vertical-align: top; }
.tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--sib-gris-texte-700); }
.tbl tr.j-rouge td:first-child { border-left: 4px solid var(--sib-critique); }
.tbl tr.j-jaune td:first-child { border-left: 4px solid var(--sib-alerte); }
.tbl tr.j-gris  td:first-child { border-left: 4px solid var(--sib-gris-texte-700); }

/* Ruban « dossier sale » — le jeu d'essai en porte deux, exprès -------- */
.sale {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 3px;
  background: repeating-linear-gradient(45deg, var(--sib-alerte-fond) 0 6px, #f7e6c8 6px 12px);
  color: var(--sib-alerte); border: 1px solid var(--sib-alerte);
}

/* Regroupement des instances de grain personne (EF-03 · hypothèse à
   éprouver : « le dossier à 4 personnes ne remplit pas l'écran ») ------ */
.groupe {
  border: 1px solid var(--sib-marine-500);
  border-left-width: 5px;
  border-radius: var(--sib-arrondi);
  background: var(--sib-blanc);
  margin-bottom: var(--sib-r3);
  overflow: hidden;
}
.groupe__entete {
  display: flex; align-items: center; gap: var(--sib-r2); flex-wrap: wrap;
  padding: var(--sib-r2) var(--sib-r3);
  background: var(--sib-marine-050);
  border-bottom: 1px solid var(--sib-marine-500);
  font-size: 12px;
}
.groupe__compte { font-weight: 700; color: var(--sib-marine-900); }

/* Note d'observation — ce que la maquette AVOUE d'elle-même ------------
   Chaque maquette porte au moins une de ces notes. C'est la matière de
   l'arbitrage : une maquette qui ne dit pas où elle plie ne se compare pas. */
.observation {
  margin: var(--sib-r4) var(--sib-r5);
  padding: var(--sib-r3) var(--sib-r4);
  border-left: 5px solid var(--sib-marine-700);
  background: var(--sib-marine-050);
  font-size: 12.5px;
}
.observation__t {
  display: block; font-weight: 700; margin-bottom: 4px;
  text-transform: uppercase; font-size: 11px; letter-spacing: .05em;
  color: var(--sib-marine-900);
}
.observation--rouge { border-left-color: var(--sib-critique); background: var(--sib-critique-fond); }
.observation--rouge .observation__t { color: var(--sib-critique); }

@media print { .banc, .observation { display: none; } .cadre { box-shadow: none; max-width: none; } }

/* Compteur de gestes — critère ③ (« compter », pas estimer) --------- */
.compteur {
  font-size: 12px;
  padding: var(--sib-r2) var(--sib-r3);
  border: 1px dashed var(--sib-marine-500);
  border-radius: var(--sib-arrondi);
  background: var(--sib-marine-050);
  color: var(--sib-marine-900);
}

/* =====================================================================
   INSTRUMENTS DE LA MAQUETTE — jamais des éléments de l'application
   Tout ce qui sert à DÉMONTRER (sauter d'un archétype à l'autre, compter
   les gestes, forcer une largeur) porte une bordure tiretée et le mot
   « instrument ». Sans cette distinction visuelle, un lecteur pressé
   prendrait un outil de démonstration pour une fonction du produit — et
   l'arbitrage porterait sur une interface qui n'existe pas.
   ===================================================================== */
/* Hauteur FIXE et identique aux cinq maquettes — correctif D3. */
.instrument {
  display: flex; flex-wrap: nowrap; align-items: center; gap: var(--sib-r2);
  padding: var(--sib-r2) var(--sib-r5);
  height: 72px; box-sizing: border-box;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;
  background: repeating-linear-gradient(45deg, #eef1f5 0 8px, #e7ebf1 8px 16px);
  border-bottom: 2px dashed var(--sib-marine-500);
  font-size: 12px;
}
.instrument > * { flex: 0 0 auto; }
.instrument .compteur { white-space: nowrap; }
.instrument__t {
  font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  font-size: 10px; color: var(--sib-marine-900);
  border: 1px dashed var(--sib-marine-500); border-radius: 3px; padding: 1px 6px;
}
.instrument button {
  font: inherit; font-size: 12px; cursor: pointer;
  padding: 3px 9px; border-radius: var(--sib-arrondi);
  border: 1px solid var(--sib-marine-500); background: var(--sib-blanc);
  color: var(--sib-marine-900);
}
.instrument button:hover { background: var(--sib-marine-050); }

/* ---------------------------------------------------------------------
   AVERTISSEMENT DE LARGEUR — correctif D1.
   ⛔ AUCUN SEUIL GLOBAL ICI, et c'est délibéré. La première version portait
   un `@container (max-width: 1380px)` commun aux cinq maquettes. Ce seuil
   est EXACT pour #5 — à 1380 px son troisième panneau se replie réellement —
   et il avait été TRANSPOSÉ à #3, où il est faux d'environ 300 px : mesuré
   en fenêtre réelle, le volet de détail de #3 ne passe sous 700 px qu'à
   **1072 px**, et rien n'y déborde horizontalement jusqu'à 1024 px inclus.

   Une alerte fausse est pire qu'une alerte absente : elle sera lue comme
   une mesure. Chaque maquette déclare donc désormais SON seuil, mesuré chez
   elle, dans sa propre feuille de style.
   ------------------------------------------------------------------- */
.alerte-largeur { display: none; }
.alerte-largeur {
  align-items: center; gap: var(--sib-r2);
  padding: 6px var(--sib-r5);
  background: var(--sib-critique-fond); color: var(--sib-critique);
  border-bottom: 2px solid var(--sib-critique);
  font-size: 12px; font-weight: 600;
}


/* ── Boîte de réception — la file à gauche, l'élément courant à droite ── */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--sib-fond, #f4f4f4);
  color: var(--sib-encre, #1b1b1d);
  font-family: var(--sib-police, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-size: 14px; line-height: 1.45;
}
.at-entete {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 20px; background: var(--sib-marine, #03305d); color: #fff;
}
/* Le logo vient de la variable de marque --logo-sib-blanc : la version pour
   fond foncé, l'en-tête étant marine. On la NOMME plutôt que de prendre
   « le premier data: URI trouvé » : les jetons en portent deux, et le
   premier est celui des fonds clairs — noir sur marine, illisible.
   ⚠️ Aucun accent grave dans ce bloc : il vit dans un gabarit JS, et un
   accent grave y fermerait le gabarit. */
.at-entete .at-logo {
  height: 30px; width: 132px; flex: none; display: block;
  background-image: var(--logo-sib-blanc);
  background-repeat: no-repeat; background-position: left center;
  background-size: contain;
}
.at-entete h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .01em; }
/* ══════════════════════════════════════════════════════════════════════
   ⛔ PAS DE RUBAN D'ÉTAPES ICI — et c'est une correction, pas un oubli.
   ══════════════════════════════════════════════════════════════════════

   Ce gabarit portait un ruban de dix onglets en tête, un par étape du
   processus. Il partait d'une bonne intention — SITUER l'écran — et il
   produisait l'effet inverse de celui qu'on cherche.

   Ce qui a été mesuré le 2026-08-05, après que Maxime a installé
   l'extension et dit « ce n'est pas l'écran qu'on a présenté au client » :

     · l'application livrée ne porte AUCUN ruban d'étapes dans sa file ;
     · la maquette retenue n'en porte aucun non plus ;
     · le gabarit en portait un. Sur ce point, il divergeait des DEUX.

   Le ruban n'était donc pas une variante d'habillage : c'était une
   invention du gabarit seul, et elle changeait la NATURE de l'écran. Une
   carte du processus avec dix onglets se lit comme une navigation ; on
   cherche où l'on est. Une boîte de réception se lit comme du travail à
   faire ; on traite la ligne du haut. Le client validait la première en
   croyant valider la seconde.

   ⚠️ LA FONCTION DU RUBAN RESTE, ELLE CHANGE DE PLACE. Situer l'écran est
   un vrai besoin — sans quoi une maquette est jolie et inutilisable.
   L'étape est donc nommée dans l'en-tête de la file, où elle qualifie le
   travail au lieu d'inviter à naviguer.
   ══════════════════════════════════════════════════════════════════════ */
/* L'en-tête de la file : ce qu'on traite, dans quel ordre, et combien
   presse. Il porte la fonction que le ruban assurait — situer — sans se
   lire comme une navigation. */
.at-file-titre {
  padding: 14px 16px 12px; border-bottom: 1px solid var(--sib-bordure, #d8d8da);
}
.at-file-titre h2 {
  margin: 0; font-size: 15px; font-weight: 600; color: var(--sib-encre, #1a1a1c);
}
.at-file-tri, .at-file-gestes {
  margin: 3px 0 0; font-size: 12px; color: var(--sib-gris-texte-700, #57575a);
}
.at-file-gestes { font-weight: 600; color: var(--sib-marine, #03305d); }
.at-file-horsv1 {
  margin: 5px 0 0; font-size: 11.5px; font-weight: 600;
  color: var(--sib-alerte, #b3541e);
}
.at-file-horsv1::before { content: "▲ "; }

/* Le contexte porté par chaque ligne — le bail, le logement, le loyer.
   C'est ce qui permet de trancher sans ouvrir la tâche. */
.at-vise { display: block; margin-top: 4px; font-size: 12.5px; }
.at-contexte {
  display: block; margin-top: 2px; font-size: 11.5px;
  color: var(--sib-gris-texte-700, #57575a);
}

/* L'urgence, en signalétique non chromatique : le triangle porte
   l'information autant que la couleur — un daltonien lit la même chose. */
.at-jeton--urgent {
  border-color: var(--sib-alerte, #b3541e);
  color: var(--sib-alerte, #b3541e); font-weight: 600;
}
.at-jeton--urgent::before { content: "▲ "; }

/* L'avertissement Loi 25 — visible sans être criard, et il ne se replie
   jamais : c'est la première chose à lire sur un écran qui montre des
   personnes et des montants. */
.at-bandeau-factice {
  display: flex; gap: 9px; align-items: baseline;
  padding: 9px 20px; font-size: 12.5px;
  background: var(--sib-alerte-fond, #fdf3ec);
  border-bottom: 1px solid var(--sib-alerte, #b3541e);
  color: var(--sib-encre, #1a1a1c);
}
@media print { .at-bandeau-factice { display: flex !important; } }

.at-app { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; min-height: calc(100vh - 116px); }
.at-file { border-right: 1px solid var(--sib-bordure, #d8d8da); background: #fff; overflow-y: auto; }
.at-file-entete {
  padding: 12px 16px; border-bottom: 1px solid var(--sib-bordure, #d8d8da);
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--sib-gris-texte-700, #57575a);
}
.at-file ol { list-style: none; margin: 0; padding: 0; }
.at-tache {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  border-bottom: 1px solid var(--sib-bordure, #d8d8da); padding: 12px 16px;
  cursor: pointer; font: inherit; color: inherit;
}
.at-tache:hover { background: #f7f9fc; }
.at-tache[aria-current="true"] { background: #eef4fb; box-shadow: inset 3px 0 0 var(--sib-marine, #03305d); }
.at-tache:focus-visible { outline: 2px solid var(--sib-marine, #03305d); outline-offset: -2px; }
.at-ligne1 { display: flex; align-items: baseline; gap: 8px; }
.at-glyphe { font-size: 15px; width: 1.2em; text-align: center; flex: none; }
.at-titre { font-weight: 600; }
.at-ligne2 {
  margin: 4px 0 0 calc(1.2em + 8px); font-size: 12.5px;
  color: var(--sib-gris-texte-700, #57575a);
}
.at-jeton {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--sib-bordure, #d8d8da); margin-right: 5px;
  color: var(--sib-gris-texte-700, #57575a); background: #fbfbfc;
}
.at-jeton--bloquant { border-color: #a4242c; color: #a4242c; font-weight: 600; }
.at-detail { padding: 22px 26px; overflow-y: auto; }
.at-detail h2 { margin: 0 0 4px; font-size: 19px; }
.at-detail .at-sous { color: var(--sib-gris-texte-700, #57575a); margin: 0 0 18px; }
.at-carte {
  background: #fff; border: 1px solid var(--sib-bordure, #d8d8da);
  border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; max-width: 720px;
}
.at-carte h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--sib-gris-texte-700, #57575a); }
.at-carte dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
.at-carte dt { color: var(--sib-gris-texte-700, #57575a); }
.at-carte dd { margin: 0; }
.at-geste { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.at-bouton {
  font: inherit; padding: 8px 16px; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--sib-marine, #03305d);
  background: var(--sib-marine, #03305d); color: #fff;
}
.at-bouton--second { background: #fff; color: var(--sib-marine, #03305d); }
.at-bouton:focus-visible { outline: 2px solid #1b1b1d; outline-offset: 2px; }
.at-vide { color: var(--sib-gris-texte-700, #57575a); }
/* ── La marque hors cadre ────────────────────────────────────────────
   Elle doit être VUE par quelqu'un qui ouvre l'écran sans savoir d'où il
   vient. Donc : un bandeau en tête, une bordure sur tout le document, et
   un filigrane. Les trois survivent à l'impression (@media print), et le
   fichier étant autonome, à l'enregistrement comme à l'envoi. */
.at-bandeau-horscadre {
  background: #7a1a20; color: #fff; padding: 11px 20px; font-size: 13.5px;
  border-bottom: 3px solid #4a0f13;
  /* Le texte REVIENT A LA LIGNE. Mesure a l'impression : sur plusieurs
     depassements, une seule ligne sortait de la page et le message etait
     coupe au bord droit. */
  overflow-wrap: anywhere; word-break: break-word; line-height: 1.45;
}
.at-bandeau-horscadre strong { letter-spacing: .01em; }
.at-bandeau-horscadre span { opacity: .95; }
body.at-est-horscadre { box-shadow: inset 0 0 0 4px #7a1a20; }
body.at-est-horscadre::after {
  content: "HORS CADRE"; position: fixed; right: -46px; top: 116px;
  transform: rotate(45deg); background: #7a1a20; color: #fff;
  padding: 6px 60px; font-size: 12px; letter-spacing: .18em;
  pointer-events: none; z-index: 40;
}
@media print {
  .at-bandeau-horscadre { background: #7a1a20 !important; color: #fff !important;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.at-est-horscadre::after { position: absolute; }
}

/* ── Le tableau, la fiche, le tableau de bord ────────────────────────
   L'atelier ne compose plus une seule forme. Ces trois-là partagent la
   coquille : même en-tête, même ruban, même marque. */
.at-plein { padding: 20px 26px; overflow: auto; grid-column: 1 / -1; }
.at-tableau { border-collapse: collapse; width: 100%; background: #fff; font-size: 13.5px; }
.at-tableau caption { text-align: left; padding: 0 0 10px; color: var(--sib-gris-texte-700, #57575a); }
.at-tableau th, .at-tableau td {
  border: 1px solid var(--sib-bordure, #d8d8da); padding: 8px 11px; text-align: left;
}
.at-tableau th { background: #f4f6f9; font-weight: 600; }
.at-tableau tbody tr:nth-child(even) { background: #fbfcfd; }
.at-compteurs { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
.at-compteur {
  background: #fff; border: 1px solid var(--sib-bordure, #d8d8da);
  border-radius: 6px; padding: 14px 20px; min-width: 150px;
}
.at-compteur .at-nombre { font-size: 27px; font-weight: 600; color: var(--sib-marine, #03305d); }
.at-compteur .at-quoi { font-size: 12.5px; color: var(--sib-gris-texte-700, #57575a); }
.at-pied {
  padding: 10px 20px; border-top: 1px solid var(--sib-bordure, #d8d8da);
  font-size: 11.5px; color: var(--sib-gris-texte-700, #57575a); background: #fff;
}
@media (max-width: 860px) { .at-app { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="at-entete">
  <span class="at-logo" role="img" aria-label="Société Immobilière Bélanger"></span>
  <h1>__TITRE__</h1>
</header>

<!-- ⚠️ L'AVERTISSEMENT LOI 25 — il manquait, et le client testait sans lui.
     Un écran qui montre des noms, des adresses et des montants SANS dire
     qu'ils sont inventés laisse croire qu'ils sont réels. Sur un module qui
     porte des renseignements personnels, ce malentendu-là se paie cher.

     Il vit DANS le document, comme la marque hors cadre : le fichier étant
     autonome, l'avertissement voyage avec lui — à l'enregistrement, à
     l'impression, à l'envoi par courriel. Un bandeau ajouté par un script
     après coup ne survivrait à aucun des trois.

     ⚠️ LE TEXTE N'EST PAS CELUI DES MAQUETTES, ET C'EST DÉLIBÉRÉ. Le leur
     nomme un code d'exigence : c'est notre vocabulaire, et le contrôle de
     l'atelier l'interdit à l'écran du client — à raison. Le client lit un
     avertissement, pas notre référence. Le fond est le même, la référence
     reste chez nous.
     (Aucun accent grave ici : ce bloc vit dans un gabarit JS.) -->
<div class="at-bandeau-factice" role="note">
  <span aria-hidden="true">⚠</span>
  <span><strong>Données factices</strong> — les personnes, les dossiers et les
  montants affichés sont inventés. Aucun renseignement personnel réel.</span>
</div>


<!-- ⚠️ LA MARQUE HORS CADRE. Écrite dans le document lui-même, pas
     ajoutée après coup : le fichier étant autonome, elle survit à
     l'enregistrement et à l'envoi. La règle @media print la garde à
     l'impression. (Aucun accent grave ici : bloc dans un gabarit JS.) -->
<div class="at-bandeau-horscadre" id="at-horscadre" hidden>
  <strong>Cet écran sort du cadre défini.</strong>
  <span id="at-horscadre-quoi"></span>
</div>

<div class="at-app">
  <aside class="at-file" aria-label="File de tâches">
    <!-- Ce qui situe l'écran, là où le ruban le faisait avant : le nom de
         l'étape qualifie le travail au lieu d'inviter à naviguer. -->
    <div class="at-file-titre">
      <h2 id="at-file-titre"></h2>
      <p class="at-file-tri" id="at-file-tri"></p>
      <p class="at-file-horsv1" id="at-file-horsv1" hidden></p>
      <p class="at-file-gestes" id="at-file-gestes"></p>
    </div>
    <div class="at-file-entete" id="at-compte"></div>
    <ol id="at-liste"></ol>
  </aside>
  <main class="at-detail" aria-live="polite" id="at-detail"></main>
</div>

<footer class="at-pied" id="at-pied"></footer>

<script type="application/json" id="at-catalogue">__CATALOGUE__</script>
<script type="application/json" id="at-ecran">__ECRAN__</script>
<script>
/* Rendu de la boîte de réception. L'ENTRÉE EST LA FILE — la fiche du
   dossier ne s'ouvre que depuis une tâche (règle du client : « les gens
   veulent voir des tâches, pas une fiche », BRD §2.3). */
(function () {
  var CAT = JSON.parse(document.getElementById('at-catalogue').textContent);
  var ECR = JSON.parse(document.getElementById('at-ecran').textContent);

  function parCode(liste, code) {
    for (var i = 0; i < liste.length; i++) if (liste[i].code === code) return liste[i];
    return null;
  }
  function dossierDe(t) { return (ECR.dossiers || {})[t.dossier] || {}; }
  function parType(code) {
    for (var i = 0; i < CAT.types_de_tache.length; i++)
      if (CAT.types_de_tache[i].type === code) return CAT.types_de_tache[i];
    return null;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* Jours d'ici l'emménagement — rend une valeur nulle quand la date manque.

     ⚠️ LA DATE DU JOUR EST CELLE DE LA COMPOSITION, FIGÉE À L'ÉCRITURE.
     Le fichier est autonome et voyage : s'il calculait « J-n » à chaque
     ouverture, un écran composé aujourd'hui dirait autre chose dans un
     mois — et le client croirait que ses données ont bougé. La référence
     est donc posée une fois, au moment où l'écran est fait. */
  function joursAvant(dateISO) {
    if (!dateISO) return null;
    var cible = Date.parse(dateISO + 'T00:00:00Z');
    if (isNaN(cible)) return null;
    var base = Date.parse(ECR.compose_le + 'T00:00:00Z');
    if (isNaN(base)) return null;
    return Math.round((cible - base) / 86400000);
  }

  /* Un séparateur de milliers en espace insécable — la convention d'ici.
     Un formatage par la locale dépendrait de la langue du poste : le même écran
     dirait « 1,450 » chez l'un et « 1 450 » chez l'autre. */
  function formaterLoyer(n) {
    return String(n).replace(/B(?=(d{3})+(?!d))/g, ' ');
  }

  var etape = parCode(CAT.etapes, ECR.etape);
  var niveau = parCode(CAT.niveaux, ECR.niveau);

  /* ── L'EN-TÊTE DE LA FILE : ce qu'on traite, et dans quel ordre ──────
     Elle remplace le ruban et porte sa fonction — situer — sans inviter
     à naviguer. Le libellé de l'étape vient du CATALOGUE : aucun libellé
     n'est écrit ici, sinon il dirait huit étapes le jour où le module en
     dira dix, sans jamais rougir. */
  var titreFile = document.getElementById('at-file-titre');
  titreFile.textContent = etape ? ('Ma file — ' + etape.libelle) : 'Ma file de tâches';
  if (etape) titreFile.setAttribute('data-etape', etape.code);

  /* ⚠️ « HORS V1 » ARRIVE ICI, ET C'EST MIEUX QU'AVANT. Le ruban le
     signalait sur dix onglets à la fois — donc sur neuf étapes que le
     client ne composait pas. Porté par le titre, l'avertissement ne
     paraît que lorsqu'il le concerne : il compose POUR cette étape-là, et
     il apprend qu'elle n'est pas dans la première version. */
  var horsV1 = document.getElementById('at-file-horsv1');
  if (etape && etape.hors_v1) {
    horsV1.textContent = 'Cette étape ne fait pas partie de la première version.';
    horsV1.hidden = false;
    titreFile.setAttribute('data-hors-v1', 'true');
  } else {
    horsV1.hidden = true;
    if (etape) titreFile.setAttribute('data-hors-v1', 'false');
  }

  /* ⚠️ LE TRI EST ANNONCÉ, PAS SEULEMENT APPLIQUÉ. Une liste triée dont
     l'ordre n'est pas dit se lit comme une liste quelconque : on la
     parcourt en entier au lieu de traiter le haut. C'est la différence
     entre une boîte de réception et une liste. */
  document.getElementById('at-file-tri').textContent =
    'triée par urgence d’emménagement';

  document.getElementById('at-compte').textContent =
    ECR.taches.length + ' tâche(s) à traiter · ' + (niveau ? niveau.libelle : '');

  /* ── LE TRI PAR URGENCE ──────────────────────────────────────────────
     Ce qui presse en haut. C'est ce qui fait qu'une boîte de réception se
     traite du haut vers le bas au lieu de se parcourir en entier.

     ⚠️ ON TRIE UNE COPIE, ET L'ORDRE D'ORIGINE DÉPARTAGE LES ÉGALITÉS.
     Le tri mute le tableau ; muter ECR.taches ferait diverger les indices
     déjà distribués, et l'écran ouvrirait la mauvaise tâche. Les dates
     égales gardent leur ordre d'arrivée : sans ce départage, deux
     compositions du même écran pourraient ne pas rendre le même ordre. */
  var ordonnees = ECR.taches.map(function (t, i) { return { t: t, i: i }; });
  ordonnees.sort(function (a, b) {
    var da = (ECR.dossiers[a.t.dossier] || {}).emmenagement || '9999-12-31';
    var db = (ECR.dossiers[b.t.dossier] || {}).emmenagement || '9999-12-31';
    if (da !== db) return da < db ? -1 : 1;
    return a.i - b.i;
  });

  /* Le compteur de gestes — combien de travail attend, et combien presse.
     Un nombre en tête de file dit en un coup d'oeil s'il faut s'y mettre. */
  var pressants = ordonnees.filter(function (o) {
    return joursAvant((ECR.dossiers[o.t.dossier] || {}).emmenagement) <= 21;
  }).length;
  var compteurs = document.getElementById('at-file-gestes');
  if (compteurs) {
    compteurs.textContent = pressants > 0
      ? (pressants + ' pressante(s) sur ' + ordonnees.length)
      : (ordonnees.length + ' à traiter, aucune urgence');
  }

  var liste = document.getElementById('at-liste');
  ordonnees.forEach(function (o) {
    var t = o.t; var i = o.i;
    var def = parType(t.type) || {};
    var arch = parCode(CAT.archetypes, def.archetype) || { glyphe: '·', libelle: '' };
    var grain = parCode(CAT.grains, def.grain) || { libelle: '' };

    // Le GRAIN commande ce que la ligne nomme : une tâche de grain
    // personne nomme la personne visée, une tâche de grain dossier
    // nomme le dossier. Les deux ne sont jamais confondues.
    var vise = def.grain === 'personne' ? t.personne : t.dossier;

    var li = document.createElement('li');
    var b = document.createElement('button');
    b.className = 'at-tache';
    b.type = 'button';
    b.setAttribute('data-etape', ECR.etape);
    b.setAttribute('data-archetype', def.archetype || '');
    b.setAttribute('data-grain', def.grain || '');
    b.setAttribute('data-type', t.type);
    b.setAttribute('data-rang-origine', String(i));
    b.setAttribute('data-ef', (def.ef || []).join(' '));
    /* ── LA DENSITÉ — ce qui sépare une boîte de réception d'une liste.
       Une ligne qui ne porte qu'un titre oblige à ouvrir chaque tâche pour
       savoir de quoi elle parle : on parcourt au lieu de traiter. La ligne
       porte donc son CONTEXTE — le bail, le logement, le loyer — et son
       URGENCE, lisibles sans un clic. */
    var d = ECR.dossiers[t.dossier] || {};
    var jours = joursAvant(d.emmenagement);

    /* ⚠️ LE NUMÉRO DE DOSSIER N'APPARAÎT QUE SUR LES TÂCHES DE GRAIN
       DOSSIER — et c'est une correction, attrapée par le contrôle avant
       livraison. Une première version le mettait sur TOUTES les lignes
       « pour la densité » : une tâche qui vise une personne se mettait
       alors à nommer un dossier, et les deux grains se confondaient à
       l'oeil. C'est exactement ce que le module interdit : la file montre
       les deux sans jamais les mélanger.

       Le logement et le loyer, eux, restent partout : ils situent le
       travail sans le rattacher au mauvais grain. */
    /* ⚠️ LE DOSSIER N'EST PAS RÉPÉTÉ. Sur une tâche de grain dossier, le
       numéro est DÉJÀ la ligne « visée » juste au-dessus : le remettre
       dans le contexte l'affichait deux fois de suite. Vu à l'écran. */
    var contexte = [
      d.logement,
      d.loyer ? (formaterLoyer(d.loyer) + ' $/mois') : null,
      d.unite
    ].filter(Boolean).join(' · ');

    b.innerHTML =
      '<span class="at-ligne1">' +
        '<span class="at-glyphe" aria-hidden="true">' + esc(arch.glyphe) + '</span>' +
        '<span class="at-titre">' + esc(def.libelle || t.type) + '</span>' +
      '</span>' +
      '<span class="at-ligne2">' +
        '<span class="at-jeton">' + esc(arch.libelle) + '</span>' +
        '<span class="at-jeton">' + esc(grain.libelle) + '</span>' +
        (def.bloquant ? '<span class="at-jeton at-jeton--bloquant">bloquant</span>' : '') +
        (jours !== null && jours <= 21
          ? '<span class="at-jeton at-jeton--urgent">Emménagement imminent J-' + jours + '</span>'
          : '') +
      '</span>' +
      '<span class="at-vise">' + esc(vise || '') + '</span>' +
      '<span class="at-contexte">' + esc(contexte) + '</span>';
    b.addEventListener('click', function () { ouvrir(i); });
    li.appendChild(b);
    liste.appendChild(li);
  });

  /* ⚠️ L'ARGUMENT EST L'INDEX D'ORIGINE, PAS LA POSITION À L'ÉCRAN — et la
     distinction est née avec le tri par urgence. Tant que la file
     s'affichait dans l'ordre du tableau, les deux coïncidaient et on
     pouvait comparer la position DOM. Depuis qu'elle est triée, ils
     divergent : la ligne surlignée était la première AFFICHÉE et le
     panneau montrait la première du TABLEAU — deux tâches différentes,
     deux personnes différentes. Vu à l'écran avant livraison.
     Chaque bouton porte donc son index d'origine, et c'est lui qu'on
     compare. */
  function ouvrir(i) {
    var boutons = liste.querySelectorAll('.at-tache');
    for (var k = 0; k < boutons.length; k++)
      boutons[k].setAttribute('aria-current',
        Number(boutons[k].getAttribute('data-rang-origine')) === i ? 'true' : 'false');

    var t = ECR.taches[i];
    var def = parType(t.type) || {};
    var arch = parCode(CAT.archetypes, def.archetype) || {};
    var grain = parCode(CAT.grains, def.grain) || {};
    var vise = def.grain === 'personne' ? t.personne : t.dossier;

    document.getElementById('at-detail').innerHTML =
      '<h2>' + esc(def.libelle || t.type) + '</h2>' +
      '<p class="at-sous">' + esc(arch.glyphe || '') + ' ' + esc(arch.libelle || '') +
        ' · ' + esc(vise || '') + '</p>' +
      /* ⚠️ CE PANNEAU EST LU PAR LE CLIENT. Aucun mot de notre métier n'y
         entre : ni code d'exigence, ni révision de dépôt, ni « grain », ni
         code machine. Tout ça vit dans les attributs data-* de la ligne,
         qui portent la traçabilité SANS l'afficher — c'est le principe :
         l'annotation est inévitable, elle n'est pas visible.
         ⚠️ Aucun accent grave dans ce bloc : il vit dans un gabarit JS. */
      '<section class="at-carte">' +
        '<h3>Ce qu\'il faut regarder</h3>' +
        '<dl>' +
          '<dt>' + (def.grain === 'personne' ? 'Personne visée' : 'Dossier visé') + '</dt>' +
            '<dd>' + esc(vise || '—') + '</dd>' +
          '<dt>Dossier</dt><dd>' + esc(t.dossier || '—') + '</dd>' +
          '<dt>Logement</dt><dd>' + esc(dossierDe(t).unite || '—') + '</dd>' +
          '<dt>Emménagement</dt><dd>' + esc(dossierDe(t).emmenagement || '—') + '</dd>' +
        '</dl>' +
      '</section>' +
      '<section class="at-carte">' +
        '<h3>Le geste attendu</h3>' +
        '<p>' + esc(arch.aide || '') + '</p>' +
        '<div class="at-geste">' +
          '<button class="at-bouton" type="button">' + esc(gesteLibelle(def.archetype)) + '</button>' +
          '<button class="at-bouton at-bouton--second" type="button" id="at-voir-fiche">' +
            'Voir la fiche du dossier</button>' +
        '</div>' +
      '</section>';

    var voir = document.getElementById('at-voir-fiche');
    if (voir) voir.addEventListener('click', function () { fiche(t); });
  }

  function gesteLibelle(a) {
    return ({ confirmation: 'Confirmer', automatique: "Voir ce que l'app a fait",
      verification: 'Ouvrir le résultat', appel: "Journaliser l'appel",
      note: 'Écrire la note', decision: 'Trancher' })[a] || 'Traiter';
  }

  /* La fiche du dossier — CONSULTABLE, jamais l'entrée. */
  function fiche(t) {
    var d = (ECR.dossiers || {})[t.dossier] || {};
    document.getElementById('at-detail').innerHTML =
      '<h2>Dossier ' + esc(t.dossier) + '</h2>' +
      '<p class="at-sous">Fiche ouverte depuis une tâche de la file.</p>' +
      '<section class="at-carte"><h3>Dossier</h3><dl>' +
        '<dt>Unité</dt><dd>' + esc(d.unite || '—') + '</dd>' +
        '<dt>Emménagement</dt><dd>' + esc(d.emmenagement || '—') + '</dd>' +
        '<dt>Personnes</dt><dd>' + esc((d.personnes || []).join(', ') || '—') + '</dd>' +
      '</dl></section>' +
      '<div class="at-geste"><button class="at-bouton" type="button" id="at-retour">' +
        '← Revenir à la file</button></div>';
    document.getElementById('at-retour')
      .addEventListener('click', function () { ouvrir(indexCourant()); });
  }
  function indexCourant() {
    var boutons = liste.querySelectorAll('.at-tache');
    for (var k = 0; k < boutons.length; k++)
      if (boutons[k].getAttribute('aria-current') === 'true') return k;
    return 0;
  }

  /* ⚠️ Pas de révision de dépôt ici, pas de « catalogue dérivé ». Un SHA de
     commit ne dit rien au client et lui donne l'impression de lire un
     document qui ne lui est pas destiné. Ce qui compte pour lui : c'est une
     maquette, rien n'est enregistré, et ce sont ses dix étapes. */
  /* Tableau · fiche · tableau de bord. Chaque cellule porte ses attributs
     de situation, comme les lignes de la file : l'écran reste reprenable
     quelle que soit sa forme. */
  function rendreAutreForme(forme) {
    var app = document.querySelector('.at-app');
    var file = document.querySelector('.at-file');
    if (file) file.parentNode.removeChild(file);
    var zone = document.getElementById('at-detail');
    zone.className = 'at-plein';

    var lignes = ECR.lignes || [];
    var colonnes = ECR.colonnes || [];

    if (forme === 'tableau') {
      var thead = '<tr>' + colonnes.map(function (c) {
        return '<th scope="col">' + esc(c.titre || c.clef) + '</th>';
      }).join('') + '</tr>';
      var tbody = lignes.map(function (l) {
        return '<tr data-concept="' + esc(l.concept || '') + '">' + colonnes.map(function (c) {
          return '<td data-attribut="' + esc(c.clef) + '">' + esc(l[c.clef] == null ? '—' : l[c.clef]) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      zone.innerHTML = '<h2>' + esc(ECR.titre_zone || 'Tableau') + '</h2>' +
        '<table class="at-tableau"><caption>' + lignes.length + ' élément(s)</caption>' +
        '<thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
      return;
    }

    if (forme === 'fiche') {
      var f = lignes[0] || {};
      zone.innerHTML = '<h2>' + esc(ECR.titre_zone || 'Fiche') + '</h2>' +
        '<section class="at-carte" data-concept="' + esc(f.concept || '') + '"><dl>' +
        colonnes.map(function (c) {
          return '<dt>' + esc(c.titre || c.clef) + '</dt>' +
                 '<dd data-attribut="' + esc(c.clef) + '">' +
                 esc(f[c.clef] == null ? '—' : f[c.clef]) + '</dd>';
        }).join('') + '</dl></section>';
      return;
    }

    if (forme === 'tableau-de-bord') {
      zone.innerHTML = '<h2>' + esc(ECR.titre_zone || 'Tableau de bord') + '</h2>' +
        '<div class="at-compteurs">' + (ECR.compteurs || []).map(function (c) {
          return '<div class="at-compteur" data-compteur="' + esc(c.clef || '') + '">' +
            '<div class="at-nombre">' + esc(c.valeur) + '</div>' +
            '<div class="at-quoi">' + esc(c.quoi) + '</div></div>';
        }).join('') + '</div>' +
        '<table class="at-tableau"><thead><tr>' + colonnes.map(function (c) {
          return '<th scope="col">' + esc(c.titre || c.clef) + '</th>';
        }).join('') + '</tr></thead><tbody>' + lignes.map(function (l) {
          return '<tr>' + colonnes.map(function (c) {
            return '<td data-attribut="' + esc(c.clef) + '">' + esc(l[c.clef] == null ? '—' : l[c.clef]) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      return;
    }

    zone.innerHTML = '<p class="at-vide">Forme « ' + esc(forme) + ' » non rendue.</p>';
  }

  document.getElementById('at-pied').textContent =
    'Maquette d\'exploration — Société Immobilière Bélanger · ' +
    'les ' + CAT.etapes.length + ' étapes de votre processus · ' +
    'aucune donnée réelle, et rien n\'est enregistré.';

  /* ── La marque hors cadre ──────────────────────────────────────────
     Posée par le script, depuis la donnée de l'écran : personne ne peut
     l'oublier en composant, et elle ne dépend d'aucun geste manuel. */
  if (ECR.hors_cadre && ECR.hors_cadre.length > 0) {
    document.body.className += ' at-est-horscadre';
    var bandeau = document.getElementById('at-horscadre');
    bandeau.removeAttribute('hidden');
    document.getElementById('at-horscadre-quoi').textContent =
      ECR.hors_cadre.map(function (d) {
        return d.pourquoi ? d.quoi + ' ' + d.pourquoi : d.quoi;
      }).join(' ');
    document.title = 'HORS CADRE — ' + document.title;
  }

  /* ── Les formes autres que la file ─────────────────────────────────
     Le tableau, la fiche et le tableau de bord se rendent dans la même
     coquille. La file reste le défaut : c'est la règle du client, « les
     gens veulent voir des tâches, pas une fiche ». */
  if (ECR.forme && ECR.forme !== 'file') {
    rendreAutreForme(ECR.forme);
  } else if (ordonnees.length > 0) {
    /* La première de l'ordre TRIÉ — c'est-à-dire ce qui presse le plus, et
       c'est aussi la ligne que l'oeil voit surlignée. Ouvrir l'indice zéro
       prenait la première du tableau, qui n'est plus celle du haut depuis
       le tri : la ligne surlignée et le panneau montraient deux personnes
       différentes. Vu à l'écran avant livraison.
       (Aucun accent grave ici : ce bloc vit dans un gabarit JS.) */
    ouvrir(ordonnees[0].i);
  }
  else document.getElementById('at-detail').innerHTML =
    '<p class="at-vide">Aucune tâche dans cette file.</p>';
})();
</script>
</body>
</html>
